{% extends "base.html" %}

{% block title %}My Notes | VulnLab{% endblock %}

{% block content %}
    <h1>My Notes</h1>
    <a href="{{ url_for('notes.create') }}">Create note</a>

    <form action="{{ url_for('notes.search') }}" method="get">
        <label for="q">Search notes</label>
        <input id="q" name="q">
        <button type="submit">Search</button>
    </form>

    {% for note in notes %}
        <article>
            <h2>
                <a href="{{ url_for('notes.detail', note_id=note['id']) }}">
                    {{ note['title'] }}
                </a>
            </h2>
            <p>{{ note['created_at'] }}</p>
        </article>
    {% else %}
        <p>You have no notes yet.</p>
    {% endfor %}
{% endblock %}

{% extends "base.html" %}

{% block title %}Admin | VulnLab{% endblock %}

{% block content %}
    <h1>Admin Dashboard</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Notes</th>
        </tr>

        {% for user in users %}
            <tr>
                <td>{{ user['id'] }}</td>
                <td>{{ user['username'] }}</td>
                <td>{{ user['role'] }}</td>
                <td>{{ user['note_count'] }}</td>
            </tr>
        {% endfor %}
    </table>
{% endblock %}

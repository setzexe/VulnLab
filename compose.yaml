services:
  vulnlab:
    build:
      context: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      VULNLAB_SECRET_KEY: ${VULNLAB_SECRET_KEY:?Set VULNLAB_SECRET_KEY before starting VulnLab}
      VULNLAB_RATELIMIT_STORAGE_URI: redis://redis:6379/0
    volumes:
      - vulnlab-data:/app/instance
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4.11-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vulnlab-data:
  redis-data: